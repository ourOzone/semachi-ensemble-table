# CI: 푸시·PR마다 GitHub의 컴퓨터가 저장소 전체를 검사한다 (백엔드 개편 B-4)
# 내 PC에서 하는 검사와 같다: 린트 → 포맷 → 타입 → 테스트(웹·서버) → 빌드
# 결과: GitHub 저장소의 Actions 탭, PR의 Checks 탭. 하나라도 실패하면 빨간 X
# B-11: 이미지 확인(만든 Docker 이미지를 배포 묶음으로 띄워 보기)을 더했다.
#       dev·main 푸시는 배포(deploy.yml)가 이 파일을 불러 검사한다 (workflow_call. 두 번 돌지 않게 여기서는 뺀다)
name: CI

on:
  push:
    branches-ignore: [dev, main] # dev·main 말고 모든 브랜치 (dev·main은 deploy.yml)
  pull_request: # PR을 열거나 새 커밋을 올릴 때
  workflow_call: # deploy.yml이 불러 쓴다

# 같은 브랜치에 새로 푸시하면 아직 도는 이전 검사는 멈춘다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 저장소를 읽기만 한다 (검사에는 쓰기 권한이 필요 없다)
permissions:
  contents: read

jobs:
  check:
    name: 검사
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 코드 받기
        uses: actions/checkout@v7

      - name: pnpm 설치 (package.json의 packageManager 버전)
        uses: pnpm/action-setup@v6

      - name: Node 설치 (.nvmrc 버전, pnpm 내려받기 캐시)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 의존성 설치 (잠금 파일 그대로)
        run: pnpm install --frozen-lockfile

      - name: 린트
        run: pnpm lint

      - name: 포맷 검사
        run: pnpm format:check

      - name: 타입 검사 (웹·서버)
        run: pnpm typecheck

      # 서버 테스트의 메모리 MongoDB 실행 파일(약 100MB)을 다음 실행에 다시 쓴다
      - name: MongoDB 실행 파일 캐시
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - name: 테스트 (웹·서버)
        run: pnpm test:run

      - name: 빌드
        run: pnpm build

  # 만든 이미지가 실제 배포 묶음(deploy/compose.yaml + Caddy)으로 동작하는지. 서버 없이 이 컴퓨터 안에서 띄운다
  images:
    name: 이미지 확인
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 코드 받기
        uses: actions/checkout@v7

      # buildx: Docker 이미지를 만드는 도구. 만든 단계를 GitHub 캐시에 남겨 다음에 다시 쓴다
      - name: 이미지 빌드 도구 준비
        uses: docker/setup-buildx-action@v4

      - name: API 이미지
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          tags: semachi-api:smoke
          load: true # 올리지 않고 이 컴퓨터의 Docker에 넣는다
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: 웹 이미지 (운영)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: VITE_APP_ENV=production
          tags: semachi-web:smoke
          load: true
          cache-from: type=gha,scope=web-production
          cache-to: type=gha,scope=web-production,mode=max

      - name: 웹 이미지 (베타)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: VITE_APP_ENV=beta
          tags: semachi-web:smoke-beta
          load: true
          cache-from: type=gha,scope=web-beta
          cache-to: type=gha,scope=web-beta,mode=max

      - name: 배포 묶음으로 띄워 확인 (deploy/smoke/run.sh)
        run: bash deploy/smoke/run.sh
