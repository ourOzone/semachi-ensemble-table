<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#f2f3f5" />
        <meta name="description" content="밴드 동아리 세마치의 합주 시간표" />
        <link rel="icon" href="/favicon.ico" />
        <link rel="apple-touch-icon" href="/logo192.png" />
        <link rel="manifest" href="/manifest.json" />
        <title>세마치 합주판</title>
        <!--
            다크 모드 (V-3 1차): 렌더링 전에 html에 dark 클래스를 붙여 첫 화면이 밝게 번쩍이지 않게 한다.
            규칙은 src/components/settings/themeStore.ts와 같다 (기억한 값, 없으면 기기 설정)
        -->
        <script>
            try {
                var saved = localStorage.getItem('semachi.theme');
                var dark = saved
                    ? saved === 'dark'
                    : matchMedia('(prefers-color-scheme: dark)').matches;
                if (dark) {
                    document.documentElement.classList.add('dark');
                    document
                        .querySelector('meta[name="theme-color"]')
                        .setAttribute('content', '#111113');
                }
            } catch (e) {}
        </script>
    </head>
    <body>
        <noscript>이 앱을 사용하려면 JavaScript를 켜야 해요.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
